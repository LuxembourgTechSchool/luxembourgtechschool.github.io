- name: Level Go
  anchor: lvlg0
  permalink: program/level-go
  description: >
    Would you like to create digital art, little games and animations? And at the same time learn the basics of coding and computers? Are you between 12 and 14 years old and curious to explore the world of technology? 
  age: 12-14
  duration: 1 Academic Year
# registration_status: open
#  registration_status: closed
  modules:
    - name: Creative Coding
      image: images/modules/lvl_go_CreativeCoding.png
      items:
        - Create digital and animated graphics with code
        - Understand the basics of coding
        - Take the first steps into web development
        - Express yourself and develop your own creative style 
    - name: Digital Thinking
      image: images/modules/lvl_go_DigitalThinking.png
      items:
        - Discover how to talk to machines and computers
        - Strengthen your logical thinking, both on-screen and through hands-on unplugged activities 
        - Get a first understanding of Artificial Intelligence and learn to think critically about it 
        - Build up digital knowledge, skills, and a healthy set of digital values 
    - name: Space Tinkering
      image: images/modules/lvl_go_SpaceTinkering.png
      items:
        - Explore how humans and robots work together 
        - Use microcontrollers and sensors to measure the world around you
        - Collect and visualise data, like a real mission control
        - Invent creative solutions to real space challenges 
  shedule:
    - day: Monday
      locations:
      - Schola Europaea Luxembourg I
    - day: Tuesday
      locations:
      - École internationale Gaston Thorn
      - Athénée de Luxembourg
    - day: Wednesday
      locations:
      - Lycée Michel Lucius
    - day: Thursday
      locations:
      - Athénée de Luxembourg
      - Online
