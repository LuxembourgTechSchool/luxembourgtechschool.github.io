{% if page.url != "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ page.title | default: page.name | escape }}",
      "item": "{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}"
    }
  ]
}
</script>
{% endif %}
